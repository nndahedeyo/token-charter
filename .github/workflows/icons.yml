name: card-icons
on:
  push:
    branches: [card-icons]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[icons]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898269+github-actions[bot]@users.noreply.github.com"
          git add icons
          git commit -m "[icons] fetched" || exit 0
          git push

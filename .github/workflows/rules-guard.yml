name: rules-guard

# ルール・採点基準・自動化そのものを変える提案には、4人の承認を求める（RULES.md「このルールの変え方」）。
# それ以外の提案では、何もせずに合格する。
on:
  pull_request:
  pull_request_review:

permissions:
  contents: read
  pull-requests: read

jobs:
  rules-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require 4 approvals for rule changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if ! echo "$files" | grep -Eq '^(RULES(\.en)?\.md|data/criteria\.json|scripts/|\.github/)'; then
            echo "通常の提案です。4人の承認は不要です"; exit 0
          fi
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq \
            '[group_by(.user.login)[] | last | select(.state=="APPROVED")] | length')
          echo "ルールの変更です。承認：$approvals / 4"
          [ "$approvals" -ge 4 ]

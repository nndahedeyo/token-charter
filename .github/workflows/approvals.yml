name: approvals

# 承認を数えて、結果を「approvals」として提案に付ける（RULES.md「承認」）。
# 提案が出たとき・更新されたときと、20分ごとに全部の提案を数え直す（承認や反対、14日の経過を反映するため）。
# 動くのは常に main の版。提案のコードは取り込まない。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: approvals-${{ github.event.pull_request.number || 'all' }}

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4（番号で固定）
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5（番号で固定）
        with:
          python-version: "3.12"
      - name: Count approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -E -s scripts/approvals.py
